{% extends "base.html" %}
{% block title %}Antrag bearbeiten{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-lg font-semibold text-gray-900 mb-1">Antrag bearbeiten</h1>
    <p class="text-sm text-gray-500 mb-4">Typ: <span class="font-medium">{{ absence.leave_type.name }}</span> (nicht änderbar)</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Von</label>
                <input type="date" name="start_date" required value="{{ absence.start_date|date:'Y-m-d' }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Bis</label>
                <input type="date" name="end_date" required value="{{ absence.end_date|date:'Y-m-d' }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Begründung / Anlass</label>
            <textarea name="reason" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">{{ absence.reason }}</textarea>
        </div>

        {% if absence.leave_type.code == "FREISTELLUNG" %}
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 space-y-3">
            <div class="flex items-center">
                <input type="checkbox" name="nachweis_vorhanden" id="nachweis_vorhanden" class="mr-2" {% if absence.nachweis_vorhanden %}checked{% endif %}>
                <label for="nachweis_vorhanden" class="text-sm text-gray-700">Bescheinigung liegt vor</label>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Bescheinigung eingereicht am</label>
                <input type="date" name="nachweis_eingereicht_am" value="{{ absence.nachweis_eingereicht_am|date:'Y-m-d' }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        {% endif %}

        <div class="flex space-x-3">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Speichern</button>
            <a href="{% url 'absences:list' %}" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
